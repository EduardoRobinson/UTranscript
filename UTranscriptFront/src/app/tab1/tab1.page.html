<ion-header>
  <ion-toolbar>
    <ion-title>Adicionar Videoaula</ion-title>
  </ion-toolbar>

  <ion-item>
  <ion-label position="floating">Título</ion-label>
  <ion-input [(ngModel)]="form.titulo" name="titulo" type="text" placeholder="Digite o título da videoaula"></ion-input>
</ion-item>


<!-- Universidade -->
<ion-item>
  <ion-label position="floating">Universidade</ion-label>
  <ion-select [(ngModel)]="form.universidadeId" name="universidade" interface="popover">
    <ion-select-option *ngFor="let uni of universidades" [value]="uni.id">
      {{ uni.nome }}
    </ion-select-option>
  </ion-select>
</ion-item>

<!-- Curso -->
<ion-item>
  <ion-label position="floating">Curso</ion-label>
  <ion-select [(ngModel)]="form.cursoId" name="curso" interface="popover" (ionChange)="buscarTemasPorCurso()">
    <ion-select-option *ngFor="let curso of cursos" [value]="curso.id">
      {{ curso.nome }}
    </ion-select-option>
  </ion-select>
</ion-item>


  <ion-item>
  <ion-label position="floating">Professor</ion-label>
  <ion-input [(ngModel)]="form.professor" name="professor" type="text" placeholder="Digite o nome do professor"></ion-input>
</ion-item>



<!-- Temas (Tags) -->
<ion-item>
  <ion-label position="stacked">Temas</ion-label>
  <ion-select [(ngModel)]="form.temasId" name="temas" interface="popover">
    <ion-select-option *ngFor="let tema of temasSugeridos" [value]="tema.id">
      {{ tema.descricao }}
    </ion-select-option>
  </ion-select>
</ion-item>
