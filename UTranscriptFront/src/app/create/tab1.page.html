<ion-header>
  <ion-toolbar>
    <ion-title>Cadastro de Videoaula</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding"> <div class="container-fixo">
<ion-card class="videoaula-card">
  <ion-card-content>
    <form [formGroup]="formVideoAula" (ngSubmit)="salvarVideoaula()">
      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 10px"
          >Título</ion-label
        >
        <ion-input formControlName="titulo" type="text"></ion-input>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="formVideoAula.get('titulo')?.touched && formVideoAula.get('titulo')?.invalid"
      >
        Título é obrigatório
      </ion-text>

      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 20px"
          >Universidade</ion-label
        >

        <ionic-selectable
          itemValueField="id"
          itemTextField="nome"
          [items]="universidades"
          formControlName="universidadeId"
          [canSearch]="true"
          placeholder="Selecione uma universidade"
        >
        </ionic-selectable>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="formVideoAula.get('universidadeId')?.touched && formVideoAula.get('universidadeId')?.invalid"
      >
        Escolha uma universidade
      </ion-text>

      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 20px"
          >Curso</ion-label
        >
        <ionic-selectable
          itemValueField="id"
          itemTextField="nome"
          [items]="cursos"
          formControlName="cursoId"
          [canSearch]="true"
          placeholder="Selecione um curso"
          (onChange)="buscarTemasPorCurso($event.value)"
        >
        </ionic-selectable>
      </ion-item>
      <ion-text
        color="danger"
        *ngIf="formVideoAula.get('cursoId')?.touched && formVideoAula.get('cursoId')?.invalid"
      >
        Escolha um curso
      </ion-text>

      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 10px"
          >Professor</ion-label
        >
        <ion-input formControlName="professor" type="text"></ion-input>
      </ion-item>

      <ion-text
        color="danger"
        *ngIf="formVideoAula.get('professor')?.touched && formVideoAula.get('professor')?.invalid"
      >
        Digite o nome do Professor
      </ion-text>

      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 20px"
          >Temas</ion-label
        >
        <ionic-selectable
          itemValueField="id"
          itemTextField="descricao"
          [items]="temasSugeridos"
          formControlName="temaId"
          [canSearch]="true"
          placeholder="Selecione um tema"
        >
        </ionic-selectable>
      </ion-item>

      <ion-text
        color="danger"
        *ngIf="formVideoAula.get('temaId')?.touched && formVideoAula.get('temaId')?.invalid"
      >
        Escolha um tema
      </ion-text>

      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 10px"
          >Prompt personalizado (opcional)</ion-label
        >
        <ion-textarea
          formControlName="promptPersonalizado"
          autoGrow="true"
          placeholder="Descreva a extração desejada. Vazio usa a extração comum."
        ></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label
          position="floating"
          style="font-family: 'Poppins', sans-serif; margin-bottom: 20px"
          >Arquivo</ion-label
        >
        <input
          type="file"
          (change)="onFileSelected($event)"
          style="margin-top: 10px"
        />
      </ion-item>

      <ion-text color="danger" *ngIf="arquivoSelecionado === null">
        Selecione um arquivo
      </ion-text>

      <ion-item
        ><ion-button expand="full" type="submit" position="floating" style="color:white;"
       color="success" [disabled]="formVideoAula.invalid || arquivoSelecionado === null"
          >Salvar Videoaula</ion-button
        ></ion-item
      >
    </form>
  </ion-card-content>
</ion-card>
</div>
</ion-content>
