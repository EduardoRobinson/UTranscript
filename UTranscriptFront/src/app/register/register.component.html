<ion-header>
  <ion-toolbar>
    <ion-title>Cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid fixed>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="5">
        <ion-card class="register-card">
          <!-- Header com logo, igual à página de login -->
          <ion-card-header class="register-hero">
            <ion-img class="register-logo" src="assets/icon/logo.png" alt="Logo"></ion-img>
          </ion-card-header>

          <ion-card-content>
            <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">
              <ion-item>
                <ion-label position="floating" class="poppins">Nome</ion-label>
                <ion-input formControlName="nome"></ion-input>
              </ion-item>

              <ion-item>
                <ion-label position="floating" class="poppins">E-mail</ion-label>
                <ion-input type="email" formControlName="email"></ion-input>
              </ion-item>

              <ion-item>
                <ion-label position="floating" class="poppins">Senha</ion-label>
                <ion-input type="password" formControlName="senha"></ion-input>
              </ion-item>

              <ion-item>
                <ion-label position="floating"
                  style="font-family: 'Poppins', sans-serif; margin-bottom: 20px">Universidade</ion-label>

                <ionic-selectable itemValueField="id" itemTextField="nome" [items]="universidades"
                  formControlName="universidade_id" [canSearch]="true" placeholder="Selecione uma universidade">
                </ionic-selectable>
              </ion-item>
              <ion-text color="danger"
                *ngIf="cadastroForm.get('universidade_id')?.touched && cadastroForm.get('universidade_id')?.invalid">
                Escolha uma universidade
              </ion-text>

              <ion-item>
                <ion-label position="floating"
                  style="font-family: 'Poppins', sans-serif; margin-bottom: 20px">Curso</ion-label>
                <ionic-selectable itemValueField="id" itemTextField="nome" [items]="cursos" formControlName="curso_id"
                  [canSearch]="true" placeholder="Selecione um curso">
                </ionic-selectable>
              </ion-item>
              <ion-text color="danger"
                *ngIf="cadastroForm.get('curso_id')?.touched && cadastroForm.get('curso_id')?.invalid">
                Escolha um curso
              </ion-text>
               <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cadastroForm.invalid">
                Cadastrar
              </ion-button>
            </form>

            <ion-button expand="block" fill="clear" type="button" routerLink="/login">
              Já tem uma conta? Entrar
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
